# GitHub Actions auto-deploy for the Railway service serving this repo.
# Wired 2026-11-07. Requires repo secret RAILWAY_TOKEN (Railway workspace token).
# Deploys the service pinned to the pushed SHA, then polls Railway's own
# deployment status (HTTP 200 alone is not proof — the old build serves it
# while the new one deploys).

name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        run: |
          for i in 1 2 3; do
            resp=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "{\"query\":\"mutation { serviceInstanceDeploy(environmentId: \\\"04d14f0d-39b9-4521-bb41-2f6b0feb75b8\\\", serviceId: \\\"53562468-f748-4238-9067-04bcbbf88aca\\\", commitSha: \\\"${{ github.sha }}\\\") }\"}")
            echo "attempt $i: $resp"
            echo "$resp" | grep -q '"serviceInstanceDeploy":true' && exit 0
            sleep 15
          done
          exit 1

      - name: Wait for deployment SUCCESS (first-edge poll)
        run: |
          for i in $(seq 1 24); do
            body=$(cat <<EOF
          {"query":"query { deployments(input: {environmentId: \"04d14f0d-39b9-4521-bb41-2f6b0feb75b8\", serviceId: \"53562468-f748-4238-9067-04bcbbf88aca\"}, first: 1) { edges { node { status createdAt } } } }"}
          EOF
          )
            st=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "$body" | grep -o '"status":"[A-Z]*"' | head -1)
            echo "poll $i: $st"
            case "$st" in
              *SUCCESS*) exit 0 ;;
              *FAILED*|*CRASHED*) exit 1 ;;
            esac
            sleep 15
          done
          exit 1

      - name: Verify live
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://deck-auto-battler-production.up.railway.app/)
            echo "check $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
